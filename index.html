
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#191919">

<title>The Homicide Atlas — Independent Case Archive</title>
<meta name="description" content="An independent case archive. Documenting cases, examining evidence.">
<meta property="og:title" content="The Homicide Atlas">
<meta property="og:description" content="Independent case archive. Documenting cases, examining evidence.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
:root {
  --bg:#f0eee9;
  --paper:#faf9f6;
  --ink:#191919;
  --muted:#77736e;
  --line:#d8d4cc;
  --red:#a63d40;
  --serif:"Playfair Display",Georgia,serif;
  --sans:"DM Sans",Arial,sans-serif;
  --mono:"DM Mono",monospace;
}

* { box-sizing:border-box; }

html { scroll-behavior:smooth; }

body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
}

a { color:inherit; text-decoration:none; }

button,input,textarea { font:inherit; }

button { cursor:pointer; }

.topline {
  height:4px;
  background:var(--red);
}

.wrap {
  width:min(1160px,calc(100% - 40px));
  margin:auto;
}

header {
  border-bottom:1px solid var(--line);
}

.header-inner {
  min-height:85px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.brand {
  display:flex;
  align-items:center;
  gap:13px;
}

.logo {
  width:43px;
  height:43px;
  border:1px solid var(--ink);
  display:grid;
  place-items:center;
  color:var(--red);
  font:18px var(--mono);
  position:relative;
}

.logo:after {
  content:"";
  position:absolute;
  inset:5px;
  border:1px dashed var(--muted);
}

.brand-name {
  font:700 16px var(--serif);
  letter-spacing:.04em;
}

.brand-tag {
  font:9px var(--mono);
  color:var(--muted);
  letter-spacing:.12em;
  margin-top:5px;
}

nav {
  display:flex;
  align-items:center;
  gap:23px;
  font:10px var(--mono);
  letter-spacing:.1em;
  text-transform:uppercase;
}

nav a:hover { color:var(--red); }

nav .admin-link {
  border:1px solid var(--line);
  padding:10px 13px;
}

.menu {
  display:none;
  background:transparent;
  border:1px solid var(--line);
  padding:9px;
}

.eyebrow {
  color:var(--red);
  font:10px var(--mono);
  letter-spacing:.14em;
  text-transform:uppercase;
}

.hero {
  padding:78px 0 50px;
  border-bottom:1px solid var(--line);
}

.hero h1 {
  font:600 clamp(43px,7vw,78px)/1.04 var(--serif);
  letter-spacing:-.04em;
  margin:19px 0;
  max-width:800px;
}

.hero p {
  max-width:560px;
  color:var(--muted);
  line-height:1.8;
  font-size:14px;
  margin-bottom:28px;
}

.search {
  display:flex;
  max-width:680px;
  background:var(--paper);
  border:1px solid var(--line);
}

.search input {
  width:100%;
  padding:16px;
  border:0;
  outline:0;
  background:transparent;
}

.search button,
.btn {
  border:0;
  background:var(--ink);
  color:white;
  padding:13px 19px;
  font:10px var(--mono);
  text-transform:uppercase;
  letter-spacing:.1em;
}

.section-head {
  display:flex;
  justify-content:space-between;
  align-items:end;
  padding:38px 0 17px;
  border-bottom:1px solid var(--line);
}

.section-head h2 {
  font:600 30px var(--serif);
  margin:0;
}

.section-head span {
  font:9px var(--mono);
  color:var(--muted);
}

.archive { padding-bottom:75px; }

.case-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:1px;
  background:var(--line);
  border:1px solid var(--line);
  margin-top:22px;
}

.case-card {
  background:var(--paper);
  display:grid;
  grid-template-columns:42% 1fr;
  min-height:220px;
}

.case-card img {
  width:100%;
  height:100%;
  min-height:220px;
  object-fit:cover;
  background:#d9d5cd;
}

.case-body {
  padding:22px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
}

.meta {
  color:var(--red);
  font:9px var(--mono);
  letter-spacing:.08em;
  text-transform:uppercase;
}

.case-body h3 {
  font:600 22px/1.2 var(--serif);
  margin:12px 0 9px;
}

.case-body p {
  font-size:12px;
  line-height:1.65;
  color:var(--muted);
}

.read-link {
  margin-top:auto;
  border-bottom:1px solid var(--red);
  padding-bottom:4px;
  font:9px var(--mono);
  text-transform:uppercase;
  letter-spacing:.1em;
}

.empty {
  padding:50px 20px;
  text-align:center;
  color:var(--muted);
  background:var(--paper);
  margin-top:22px;
}

.page {
  min-height:65vh;
  padding:50px 0 80px;
}

.page-head {
  border-bottom:1px solid var(--line);
  padding-bottom:28px;
  margin-bottom:30px;
}

.page-head h1 {
  font:600 clamp(37px,6vw,60px)/1.1 var(--serif);
  margin:12px 0;
}

.page-head p {
  color:var(--muted);
  line-height:1.7;
}

.article-meta {
  display:flex;
  flex-wrap:wrap;
  gap:18px;
  font:9px var(--mono);
  color:var(--muted);
  text-transform:uppercase;
}

.cover {
  width:100%;
  max-height:490px;
  object-fit:cover;
  margin:12px 0 28px;
  background:#d9d5cd;
}

.credit {
  color:var(--muted);
  font:9px var(--mono);
  margin-top:-18px;
  margin-bottom:28px;
}

.article-layout {
  display:grid;
  grid-template-columns:210px 1fr;
  gap:50px;
}

.toc {
  position:sticky;
  top:20px;
  align-self:start;
  border-top:2px solid var(--ink);
  padding-top:14px;
}

.toc strong {
  font:10px var(--mono);
  text-transform:uppercase;
}

.toc a {
  display:block;
  padding:10px 0;
  border-bottom:1px solid var(--line);
  color:var(--muted);
  font-size:12px;
}

.toc a:hover { color:var(--red); }

.article-section {
  padding-bottom:28px;
  margin-bottom:28px;
  border-bottom:1px solid var(--line);
  scroll-margin-top:20px;
}

.article-section h2 {
  font:600 27px var(--serif);
}

.article-content {
  font-size:15px;
  line-height:1.9;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.about-copy {
  max-width:700px;
  font-size:15px;
  line-height:1.95;
}

.notice {
  background:#eae6de;
  border-left:3px solid var(--red);
  padding:13px 15px;
  font-size:12px;
  line-height:1.65;
  margin:16px 0;
}

.footer {
  border-top:1px solid var(--line);
  padding:25px 0 35px;
  color:var(--muted);
  display:flex;
  justify-content:space-between;
  gap:20px;
  font:9px var(--mono);
}

.admin {
  max-width:850px;
  margin:auto;
}

.panel {
  background:var(--paper);
  border:1px solid var(--line);
  padding:25px;
  margin:18px 0;
}

.panel h2 {
  font:600 25px var(--serif);
}

.field {
  display:flex;
  flex-direction:column;
  gap:7px;
  margin:15px 0;
}

.field label {
  color:var(--muted);
  font:9px var(--mono);
  text-transform:uppercase;
  letter-spacing:.1em;
}

.field input,
.field textarea {
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  background:white;
  outline-color:var(--red);
}

.field textarea {
  min-height:180px;
  resize:vertical;
  line-height:1.7;
}

.field .short { min-height:85px; }

.actions {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:18px;
}

.secondary {
  background:transparent;
  color:var(--ink);
  border:1px solid var(--line);
}

.danger { background:#7d292c; }

.case-admin {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:15px 0;
  border-bottom:1px solid var(--line);
}

.case-admin small {
  display:block;
  color:var(--muted);
  margin-top:5px;
  font:9px var(--mono);
}

.status {
  color:var(--red);
  font:9px var(--mono);
  text-transform:uppercase;
}

.error { color:#922f33; }

.loading {
  padding:40px 0;
  color:var(--muted);
  font:10px var(--mono);
}

.hidden { display:none!important; }

@media(max-width:800px) {
  .case-grid { grid-template-columns:1fr; }
  .article-layout { grid-template-columns:1fr; gap:25px; }
  .toc { position:static; display:grid; grid-template-columns:1fr 1fr; }
  .toc strong { grid-column:1/-1; }
}

@media(max-width:560px) {
  .wrap { width:calc(100% - 30px); }
  .header-inner { flex-wrap:wrap; padding:13px 0; }
  .menu { display:block; }
  nav { display:none; width:100%; flex-wrap:wrap; padding:10px 0; }
  nav.open { display:flex; }
  .hero { padding-top:52px; }
  .hero h1 { font-size:46px; }
  .case-card { grid-template-columns:1fr; }
  .case-card img { height:190px; min-height:190px; }
  .case-body { min-height:180px; }
  .footer { flex-direction:column; }
  .panel { padding:18px; }
}
</style>
</head>

<body>
<div class="topline"></div>

<header>
  <div class="wrap header-inner">
    <a href="#/" class="brand">
      <span class="logo">HA</span>
      <span>
        <span class="brand-name">THE HOMICIDE ATLAS</span>
        <span class="brand-tag">INDEPENDENT CASE ARCHIVE</span>
      </span>
    </a>

    <button class="menu" id="menu">☰</button>

    <nav id="nav">
      <a href="#/">Archive</a>
      <a href="#/about">About</a>
      <a href="#/admin" class="admin-link">Admin ↗</a>
    </nav>
  </div>
</header>

<main class="wrap" id="app">
  <div class="loading">LOADING ARCHIVE…</div>
</main>

<footer class="wrap footer">
  <span>THE HOMICIDE ATLAS · INDEPENDENT CASE ARCHIVE</span>
  <span>DOCUMENTING CASES. EXAMINING EVIDENCE.</span>
</footer>

<script>
(() => {
  const config = window.ATLAS_CONFIG || {};

  const configured =
    config.supabaseUrl &&
    config.supabaseKey &&
    !config.supabaseUrl.includes("YOUR_") &&
    !config.supabaseKey.includes("YOUR_") &&
    window.supabase;

  const db = configured
    ? window.supabase.createClient(config.supabaseUrl, config.supabaseKey)
    : null;

  const app = document.getElementById("app");
  const nav = document.getElementById("nav");

  let user = null;
  let editingId = null;
  let allCases = [];

  const sections = [
    ["background","Background"],
    ["timeline","Timeline"],
    ["investigation","Investigation"],
    ["legal","Legal proceedings"],
    ["perspective","My perspective"],
    ["sources","Sources"]
  ];

  function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    })[char]);
  }

  function slugify(value) {
    return String(value || "case")
      .toLowerCase()
      .normalize("NFKD")
      .replace(/[\u0300-\u036f]/g,"")
      .replace(/[^a-z0-9]+/g,"-")
      .replace(/^-|-$/g,"")
      .slice(0,70);
  }

  function message(id,text) {
    const element = document.getElementById(id);
    if(element) element.textContent = text;
  }

  function setupRequired() {
    app.innerHTML = `
      <section class="page">
        <div class="page-head">
          <div class="eyebrow">SETUP REQUIRED</div>
          <h1>Connect the archive.</h1>
          <p>Add your Supabase Project URL and publishable key to config.js, then refresh.</p>
        </div>
        <div class="notice">
          Only use your publishable key here. Never use your service_role key.
        </div>
      </section>`;
  }

  async function getPublishedCases() {
    const {data,error} = await db
      .from("cases")
      .select("*")
      .eq("status","published")
      .order("published_at",{ascending:false});

    if(error) throw error;
    return data || [];
  }

  function drawCards(cases) {
    const host = document.getElementById("cards");
    if(!host) return;

    document.getElementById("count").textContent =
      `${cases.length} PUBLISHED ${cases.length === 1 ? "CASE" : "CASES"}`;

    if(!cases.length) {
      host.className = "empty";
      host.textContent = "No published cases match that search.";
      return;
    }

    host.className = "case-grid";

    host.innerHTML = cases.map(c => `
      <article class="case-card">
        <a href="#/case/${encodeURIComponent(c.slug)}">
          ${c.cover_image
            ? `<img src="${esc(c.cover_image)}" alt="" loading="lazy">`
            : `<div style="height:220px;background:#dedad2"></div>`}
        </a>

        <div class="case-body">
          <div class="meta">
            ${esc(c.location || "LOCATION NOT LISTED")}
            ${c.year ? " · " + esc(c.year) : ""}
          </div>

          <h3>${esc(c.title)}</h3>

          <p>${esc(c.summary || "Open the case file to read the documented record.")}</p>

          <a class="read-link" href="#/case/${encodeURIComponent(c.slug)}">
            Read case ↗
          </a>
        </div>
      </article>
    `).join("");
  }

  async function home() {
    if(!db) return setupRequired();

    app.innerHTML = `
      <section class="hero">
        <div class="eyebrow">INDEPENDENT CASE ARCHIVE · EST. 2026</div>

        <h1>Every case leaves<br>questions behind.</h1>

        <p>
          A growing archive of documented cases, investigations and the
          questions that remain. Facts, allegations and personal analysis
          are kept distinct.
        </p>

        <div class="search">
          <input id="search" type="search"
            placeholder="Search a case, person or location…">
          <button id="searchbtn">Search</button>
        </div>
      </section>

      <section class="archive">
        <div class="section-head">
          <h2>Case archive</h2>
          <span id="count">LATEST ENTRIES</span>
        </div>

        <div id="cards" class="loading">RETRIEVING PUBLISHED CASES…</div>
      </section>
    `;

    try {
      allCases = await getPublishedCases();
      drawCards(allCases);

      const input = document.getElementById("search");

      function search() {
        const query = input.value.trim().toLowerCase();

        drawCards(allCases.filter(c =>
          [c.title,c.location,c.year,c.summary]
            .join(" ")
            .toLowerCase()
            .includes(query)
        ));
      }

      input.addEventListener("input",search);
      document.getElementById("searchbtn").onclick = search;

    } catch(error) {
      document.getElementById("cards").innerHTML =
        `<p class="error">Could not load archive: ${esc(error.message)}</p>`;
    }
  }

  async function casePage(slug) {
    if(!db) return setupRequired();

    app.innerHTML = `<div class="loading">OPENING CASE FILE…</div>`;

    try {
      const {data:caseData,error} = await db
        .from("cases")
        .select("*")
        .eq("slug",slug)
        .eq("status","published")
        .maybeSingle();

      if(error) throw error;

      if(!caseData) {
        app.innerHTML = `
          <section class="page">
            <div class="eyebrow">404 · FILE NOT FOUND</div>
            <h1>Case unavailable.</h1>
            <a class="read-link" href="#/">Return to archive</a>
          </section>`;
        return;
      }

      const {data:rows,error:sectionError} = await db
        .from("case_sections")
        .select("*")
        .eq("case_id",caseData.id)
        .order("position");

      if(sectionError) throw sectionError;

      const content = {};
      (rows || []).forEach(row => {
        content[row.section_key] = row.content;
      });

      app.innerHTML = `
        <article class="page">
          <div class="page-head">
            <div class="eyebrow">CASE FILE</div>
            <h1>${esc(caseData.title)}</h1>

            <div class="article-meta">
              <span>${esc(caseData.location || "Location not listed")}</span>
              <span>${esc(caseData.year || "Year not listed")}</span>
              <span>
                Published ${
                  caseData.published_at
                    ? new Date(caseData.published_at).toLocaleDateString()
                    : "date unavailable"
                }
              </span>
            </div>
          </div>

          ${caseData.cover_image
            ? `<img class="cover" src="${esc(caseData.cover_image)}" alt="Case cover">`
            : ""}

          ${caseData.cover_credit
            ? `<div class="credit">IMAGE CREDIT: ${esc(caseData.cover_credit)}</div>`
            : ""}

          <div class="article-layout">
            <aside class="toc">
              <strong>In this file</strong>
              ${sections.map(([key,name]) =>
                `<a href="#section-${key}">${name}</a>`
              ).join("")}
            </aside>

            <div>
              ${sections.map(([key,name]) => `
                <section class="article-section" id="section-${key}">
                  <h2>${name}</h2>
                  <div class="article-content">${esc(
                    content[key] || "No information has been added to this section yet."
                  )}</div>
                </section>
              `).join("")}
            </div>
          </div>

          <a class="read-link" href="#/">← Back to archive</a>
        </article>
      `;

    } catch(error) {
      app.innerHTML = `<p class="error">Unable to open case: ${esc(error.message)}</p>`;
    }
  }

  function about() {
    app.innerHTML = `
      <section class="page">
        <div class="page-head">
          <div class="eyebrow">THE PROJECT</div>
          <h1>About the Atlas.</h1>
          <p>An independent project built around curiosity, research and the search for answers.</p>
        </div>

        <div class="about-copy">
          <p>
            The Homicide Atlas started with a simple interest: true crime.
            I find myself drawn to the questions, the investigations and
            the search for answers behind real cases.
          </p>

          <p>
            I hope to pursue forensic science someday, and this project
            is a way to explore that interest.
          </p>

          <p>
            I'm not doing this alone. My friend June is helping me research
            and investigate cases along the way.
          </p>

          <p>
            We're here to document, question and understand — one case at a time.
          </p>
        </div>

        <div class="notice">
          This is an independent research project. Information is drawn from
          cited public sources. Allegations are not presented as established
          facts, and personal analysis is identified separately.
        </div>
      </section>
    `;
  }

  async function admin() {
    if(!db) return setupRequired();

    app.innerHTML = `
      <section class="page admin">
        <div class="page-head">
          <div class="eyebrow">RESTRICTED AREA</div>
          <h1>Admin desk.</h1>
          <p>Sign in to manage the case archive.</p>
        </div>
        <div class="panel" id="adminbody">Checking session…</div>
      </section>
    `;

    const {data:{session}} = await db.auth.getSession();
    user = session?.user || null;
    await adminBody();
  }

  async function adminBody() {
    const host = document.getElementById("adminbody");
    if(!host) return;

    if(!user) {
      host.innerHTML = `
        <h2>Administrator sign in</h2>

        <div class="field">
          <label>Email</label>
          <input id="email" type="email" autocomplete="username">
        </div>

        <div class="field">
          <label>Password</label>
          <input id="password" type="password" autocomplete="current-password">
        </div>

        <div class="actions">
          <button class="btn" id="login">Sign in</button>
        </div>

        <p id="adminmsg" class="notice">
          Use the administrator account you created in Supabase Authentication.
        </p>
      `;

      document.getElementById("login").onclick = async () => {
        message("adminmsg","Signing in…");

        const {data,error} = await db.auth.signInWithPassword({
          email:document.getElementById("email").value,
          password:document.getElementById("password").value
        });

        if(error) {
          message("adminmsg",error.message);
          return;
        }

        user = data.user;
        adminBody();
      };

      return;
    }

    const {data:cases,error} = await db
      .from("cases")
      .select("*")
      .order("updated_at",{ascending:false});

    if(error) {
      host.innerHTML = `<p class="error">${esc(error.message)}</p>`;
      return;
    }

    host.innerHTML = `
      <div class="actions" style="justify-content:space-between">
        <h2>Your case files</h2>
        <button class="btn" id="newcase">+ New case</button>
      </div>

      <div class="notice">Signed in as ${esc(user.email)}.</div>

      <div>
        ${(cases || []).map(c => `
          <div class="case-admin">
            <div>
              <strong>${esc(c.title)}</strong>
              <small>
                ${esc(c.location || "No location")} ·
                <span class="status">${esc(c.status)}</span>
              </small>
            </div>

            <div class="actions">
              <button class="btn secondary" data-edit="${c.id}">Edit</button>
              <button class="btn secondary"
                data-toggle="${c.id}"
                data-status="${c.status}">
                ${c.status === "published" ? "Unpublish" : "Publish"}
              </button>
              <button class="btn danger" data-delete="${c.id}">Delete</button>
            </div>
          </div>
        `).join("") || "<p>No case files yet. Create your first one.</p>"}
      </div>

      <div class="actions">
        <button class="btn secondary" id="logout">Sign out</button>
      </div>

      <p id="adminmsg" class="notice"></p>
    `;

    document.getElementById("newcase").onclick = () => location.hash = "#/edit";

    document.getElementById("logout").onclick = async () => {
      await db.auth.signOut();
      user = null;
      adminBody();
    };

    host.querySelectorAll("[data-edit]").forEach(button => {
      button.onclick = () => location.hash = "#/edit/" + button.dataset.edit;
    });

    host.querySelectorAll("[data-toggle]").forEach(button => {
      button.onclick = async () => {
        const next = button.dataset.status === "published" ? "draft" : "published";

        const {error} = await db
          .from("cases")
          .update({
            status:next,
            published_at:next === "published" ? new Date().toISOString() : null,
            updated_at:new Date().toISOString()
          })
          .eq("id",button.dataset.toggle);

        if(error) message("adminmsg",error.message);
        else adminBody();
      };
    });

    host.querySelectorAll("[data-delete]").forEach(button => {
      button.onclick = async () => {
        if(!confirm("Permanently delete this case and its sections?")) return;

        const {error} = await db
          .from("cases")
          .delete()
          .eq("id",button.dataset.delete);

        if(error) {
          message("adminmsg",error.message);
        } else {
          adminBody();
        }
      };
    });
  }

  async function editor(id) {
    if(!db) return setupRequired();

    const {data:{session}} = await db.auth.getSession();
    user = session?.user || null;

    if(!user) {
      location.hash = "#/admin";
      return;
    }

    editingId = id || null;

    let item = {
      title:"",
      slug:"",
      location:"",
      year:"",
      summary:"",
      cover_image:"",
      cover_credit:""
    };

    const contents = {};

    if(id) {
      const {data,error} = await db
        .from("cases")
        .select("*")
        .eq("id",id)
        .single();

      if(error) {
        app.innerHTML = `<p class="error">${esc(error.message)}</p>`;
        return;
      }

      item = data;

      const {data:rows} = await db
        .from("case_sections")
        .select("*")
        .eq("case_id",id);

      (rows || []).forEach(row => {
        contents[row.section_key] = row.content;
      });
    }

    app.innerHTML = `
      <section class="page admin">
        <div class="page-head">
          <div class="eyebrow">ADMIN · CASE EDITOR</div>
          <h1>${id ? "Edit case file" : "New case file"}</h1>
          <p>Keep sourced facts separate from your own perspective.</p>
        </div>

        <div class="panel">
          <div class="field">
            <label>Case title</label>
            <input id="title" value="${esc(item.title)}">
          </div>

          <div class="field">
            <label>URL slug</label>
            <input id="slug" value="${esc(item.slug)}">
          </div>

          <div class="field">
            <label>Location</label>
            <input id="location" value="${esc(item.location)}">
          </div>

          <div class="field">
            <label>Year</label>
            <input id="year" value="${esc(item.year)}">
          </div>

          <div class="field">
            <label>Short archive introduction</label>
            <textarea class="short" id="summary">${esc(item.summary)}</textarea>
          </div>

          <div class="field">
            <label>Cover image URL</label>
            <input id="cover" value="${esc(item.cover_image)}"
              placeholder="https://…">
          </div>

          <div class="field">
            <label>Cover image credit</label>
            <input id="credit" value="${esc(item.cover_credit)}">
          </div>

          <div class="field">
            <label>Or upload a cover image</label>
            <input id="coverfile" type="file" accept="image/jpeg,image/png,image/webp">
          </div>

          <div class="notice">
            Use relevant, non-graphic images that you have permission to use.
            Add a clear image credit.
          </div>
        </div>

        ${sections.map(([key,name]) => `
          <div class="panel">
            <div class="eyebrow">CASE SECTION</div>
            <h2>${name}</h2>
            <div class="field">
              <textarea id="sec-${key}" aria-label="${name}">${esc(contents[key] || "")}</textarea>
            </div>
          </div>
        `).join("")}

        <div class="panel">
          <div class="actions">
            <button class="btn" id="save">Save draft</button>
            <button class="btn secondary" id="publish">Save & publish</button>
            <button class="btn secondary" id="back">Back to admin</button>
          </div>
          <p id="savemsg" class="notice">
            Drafts are private. Publishing makes a case publicly visible.
          </p>
        </div>
      </section>
    `;

    document.getElementById("back").onclick = () => location.hash = "#/admin";

    async function save(publish) {
      const title = document.getElementById("title").value.trim();

      if(!title) {
        message("savemsg","Please add a case title.");
        return;
      }

      message("savemsg","Saving…");

      let cover = document.getElementById("cover").value.trim();
      const file = document.getElementById("coverfile").files[0];

      if(file) {
        if(file.size > 5 * 1024 * 1024) {
          message("savemsg","Cover image must be 5 MB or smaller.");
          return;
        }

        const extension = (file.name.split(".").pop() || "jpg")
          .toLowerCase()
          .replace(/[^a-z0-9]/g,"");

        const path = `${user.id}/${crypto.randomUUID()}.${extension}`;

        const {error:uploadError} = await db.storage
          .from("case-covers")
          .upload(path,file,{
            upsert:false,
            contentType:file.type
          });

        if(uploadError) {
          message("savemsg","Image upload failed: " + uploadError.message);
          return;
        }

        const {data:urlData} = db.storage
          .from("case-covers")
          .getPublicUrl(path);

        cover = urlData.publicUrl;
      }

      const slug =
        document.getElementById("slug").value.trim() ||
        slugify(title);

      const row = {
        title,
        slug,
        location:document.getElementById("location").value.trim(),
        year:document.getElementById("year").value.trim(),
        summary:document.getElementById("summary").value.trim(),
        cover_image:cover,
        cover_credit:document.getElementById("credit").value.trim(),
        status:publish ? "published" : "draft",
        updated_at:new Date().toISOString(),
        published_at:publish ? new Date().toISOString() : null
      };

      let result;

      if(editingId) {
        result = await db
          .from("cases")
          .update(row)
          .eq("id",editingId)
          .select()
          .single();
      } else {
        result = await db
          .from("cases")
          .insert(row)
          .select()
          .single();
      }

      if(result.error) {
        message("savemsg","Could not save case: " + result.error.message);
        return;
      }

      const caseId = result.data.id;

      for(let i=0;i<sections.length;i++) {
        const key = sections[i][0];
        const content = document.getElementById("sec-" + key).value;

        const {error} = await db
          .from("case_sections")
          .upsert({
            case_id:caseId,
            section_key:key,
            content,
            position:i
          },{
            onConflict:"case_id,section_key"
          });

        if(error) {
          message("savemsg",
            "Case saved, but section " + key + " failed: " + error.message);
          return;
        }
      }

      editingId = caseId;

      message(
        "savemsg",
        publish
          ? "Published. Your case is now visible in the public archive."
          : "Draft saved successfully."
      );
    }

    document.getElementById("save").onclick = () => save(false);
    document.getElementById("publish").onclick = () => save(true);
  }

  function route() {
    nav.classList.remove("open");

    const hash = location.hash || "#/";

    if(hash.startsWith("#/case/")) {
      casePage(decodeURIComponent(hash.slice(7)));
    } else if(hash === "#/about") {
      about();
    } else if(hash === "#/admin") {
      admin();
    } else if(hash === "#/edit") {
      editor(null);
    } else if(hash.startsWith("#/edit/")) {
      editor(decodeURIComponent(hash.slice(7)));
    } else {
      home();
    }
  }

  document.getElementById("menu").onclick = () => {
    nav.classList.toggle("open");
  };

  window.addEventListener("hashchange",route);

  route();
})();
</script>
</body>
</html>
